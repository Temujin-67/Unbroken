name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install
          # Must be saved to package.json (only on the build machine): Capacitor only links plugins listed there.
          npm install @capacitor-firebase/analytics@8.5.2

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp app.js index.html style.css config.js supabase.js www/
          sed -i.bak "s/__APP_BUILD__/${{ github.run_number }}/" www/app.js && rm -f www/app.js.bak
          cp maintenance.json reframes.json right_now.json www/
          [ -d assets ] && cp -r assets www/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icons and splash screen
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png
          cp splash.png resources/splash.png
          npx capacitor-assets generate --android

      - name: Add Firebase config
        run: cp google-services.json android/app/google-services.json

      - name: Sync web assets
        run: npx cap sync android

      - name: Check Firebase plugin is linked
        run: |
          grep -q "capacitor-firebase-analytics" android/capacitor.settings.gradle || { echo "::error::Firebase Analytics plugin not linked"; exit 1; }
          echo "::notice::Firebase Analytics plugin linked"

      - name: Declare advertising ID permission (Play requires it; Firebase Analytics + Google Ads)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "permission.AD_ID" "$M" || sed -i 's#</manifest>#    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n</manifest>#' "$M"
          grep -q "com.google.android.gms.permission.AD_ID" "$M" || { echo "::error::AD_ID permission missing from manifest"; exit 1; }
          echo "::notice::AD_ID permission declared"

      - name: Set version code
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Add signing config to build.gradle
        run: |
          cat >> android/app/build.gradle << 'GRADLE_EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE_EOF

      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Check AD_ID is in the final merged manifest
        run: |
          F=$(grep -rl "com.google.android.gms.permission.AD_ID" android/app/build/intermediates --include=AndroidManifest.xml | head -1)
          [ -n "$F" ] || { echo "::error::AD_ID permission not in merged manifest"; exit 1; }
          if grep -rl 'permission.AD_ID"[^>]*tools:node="remove"' android/app/build/intermediates --include=AndroidManifest.xml | grep -q .; then echo "::error::AD_ID removed by a library"; exit 1; fi
          echo "::notice::AD_ID present in merged manifest: $F"

      - name: Name AAB with version
        run: cp android/app/build/outputs/bundle/release/app-release.aab so-be-it-${{ github.run_number }}.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: so-be-it-${{ github.run_number }}
          path: so-be-it-${{ github.run_number }}.aab
